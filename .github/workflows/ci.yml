name: ci

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install -U pip
          python -m pip install -r requirements-dev.txt

      - name: Compile Python files
        run: python -m compileall -q app.py visual_lab_core.py tests scripts

      - name: Ruff lint
        run: python -m ruff check app.py visual_lab_core.py tests scripts

      - name: Ruff format check
        run: python -m ruff format --check app.py visual_lab_core.py tests scripts

      - name: Pytest
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
          SMOKE_IMPORTS: numpy,pandas,streamlit,matplotlib,seaborn,scipy
        run: python -m pytest tests -q

      - name: Docker build
        run: docker build --target runtime -t seaborn-matplotlib-visual-lab:ci .
